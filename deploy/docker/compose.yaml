# PHX-G50 — single-host reference Compose (ADR-0069)
# Usage:
#   cp deploy/docker/.env.example deploy/docker/.env
#   docker compose -f deploy/docker/compose.yaml --env-file deploy/docker/.env up --build

name: noventi-eaos

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eaos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: eaos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaos -d eaos"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - eaos_pg:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "${GATEWAY_HOST_PORT:-8000}:8000"
    environment:
      EAOS_DATABASE_URL: postgresql+psycopg://eaos:${POSTGRES_PASSWORD}@db:5432/eaos
      EAOS_REQUIRE_JWT: "1"
      EAOS_ALLOW_DEV_CONTEXT_HEADERS: "0"
      EAOS_JWT_SECRET: ${EAOS_JWT_SECRET:?set EAOS_JWT_SECRET in .env}
      EAOS_JWT_ISSUER: ${EAOS_JWT_ISSUER:-https://eaos.local/issuer}
      EAOS_JWT_AUDIENCE: ${EAOS_JWT_AUDIENCE:-eaos-api}
      # PHX-G76 — optional deploy-region label (empty = unlabeled)
      EAOS_DEPLOY_REGION: ${EAOS_DEPLOY_REGION:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  eaos_pg:
