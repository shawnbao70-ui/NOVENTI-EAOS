apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eaos.gateway.fullname" . }}
  labels:
    {{- include "eaos.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if and (not .Values.autoscaling.enabled) (not .Values.keda.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "eaos.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "eaos.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
        {{- if and .Values.region.id .Values.region.labelPods }}
        eaos.noventi.io/deploy-region: {{ .Values.region.id | quote }}
        {{- end }}
        {{- if .Values.mesh.enabled }}
        {{ .Values.mesh.injectLabelKey | quote }}: {{ .Values.mesh.injectLabelValue | quote }}
        {{- with .Values.mesh.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- if and .Values.mesh.enabled .Values.mesh.podAnnotations }}
      annotations:
        {{- toYaml .Values.mesh.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.gateway.automountServiceAccountToken | default false }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.gateway.runAsUser | default 10001 }}
        runAsGroup: {{ .Values.gateway.runAsGroup | default 10001 }}
        fsGroup: {{ .Values.gateway.fsGroup | default 10001 }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.gateway.readOnlyRootFilesystem | default false }}
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: EAOS_ENV
              value: {{ .Values.gateway.envProfile | default "production" | quote }}
            - name: EAOS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "eaos.secretName" . }}
                  key: EAOS_DATABASE_URL
            - name: EAOS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "eaos.secretName" . }}
                  key: EAOS_JWT_SECRET
            - name: EAOS_REQUIRE_JWT
              value: {{ .Values.gateway.requireJwt | quote }}
            - name: EAOS_ALLOW_DEV_CONTEXT_HEADERS
              value: {{ .Values.gateway.allowDevContextHeaders | quote }}
            - name: EAOS_JWT_ISSUER
              value: {{ .Values.gateway.jwtIssuer | quote }}
            - name: EAOS_JWT_AUDIENCE
              value: {{ .Values.gateway.jwtAudience | quote }}
            {{- if .Values.region.id }}
            - name: EAOS_DEPLOY_REGION
              value: {{ .Values.region.id | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
