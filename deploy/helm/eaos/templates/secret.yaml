apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eaos.secretName" . }}
  labels:
    {{- include "eaos.labels" . | nindent 4 }}
type: Opaque
stringData:
  EAOS_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  EAOS_DATABASE_URL: {{ include "eaos.databaseUrl" . | quote }}
