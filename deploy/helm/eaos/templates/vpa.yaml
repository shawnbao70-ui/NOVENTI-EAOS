{{- if and .Values.autoscaling.enabled .Values.vpa.enabled }}
{{- fail "PHX-G54: autoscaling (HPA) and vpa cannot both be enabled" }}
{{- end }}
{{- if and .Values.keda.enabled .Values.vpa.enabled }}
{{- fail "PHX-G58: keda and vpa cannot both be enabled" }}
{{- end }}
{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "eaos.gateway.fullname" . }}
  labels:
    {{- include "eaos.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "eaos.gateway.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: gateway
        controlledResources:
          {{- range .Values.vpa.controlledResources }}
          - {{ . | quote }}
          {{- end }}
        {{- if .Values.vpa.minAllowed }}
        minAllowed:
          {{- toYaml .Values.vpa.minAllowed | nindent 10 }}
        {{- end }}
        {{- if .Values.vpa.maxAllowed }}
        maxAllowed:
          {{- toYaml .Values.vpa.maxAllowed | nindent 10 }}
        {{- end }}
{{- end }}
