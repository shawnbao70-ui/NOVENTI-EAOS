openapi: 3.1.0
info:
  title: NOVENTI EAOS Marketplace API
  version: 1.2.17
  description: |
    PHX-G186 tightens Marketplace status GET body field parity
    (PaymentClearingProduct + FoundationStatusData vs runtime emit).
    PHX-G181 documents named Marketplace status codes (400/403/404/409/503).
    PHX-M16 technical distribution + PHX-M17 Foundation commercial policy (ADR-0054)
    + PHX-G162 Eng Explicit Defer `4` payment clearing (env-gated internal record)
    + PHX-G172/G173 allowlisted host-acquire (technical acquire + first-party
    Extension Host projection; status posture exposes host_acquire_product;
    no Marketplace arbitrary scripts; not a package install)
    + PHX-G174 KernelError → GatewayDetailError envelope.
    Acquire remains a technical record, not a purchase settlement. External PSP
    capture/refund and external arbitration remain fail-closed.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /marketplace/status:
    get:
      operationId: getMarketplaceStatus
      summary: Read-only Foundation status posture
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Marketplace Foundation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationStatusEnvelope"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}/payment-clearing:
    post:
      operationId: createMarketplacePaymentClearing
      summary: Env-gated internal payment clearing (PHX-G162)
      description: |
        Default OFF → 503 GATEWAY_PAYMENT_CLEARING_DISABLED.
        When EAOS_MARKETPLACE_PAYMENT_CLEARING_ENABLED=true, records an
        internal audit-backed clearing linked to an issued invoice.
        Does not call an external payment-service provider.
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentClearingRequest"
      responses:
        "201":
          description: Internal clearing recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentClearingEnvelope"
        "422":
          description: Closed-schema validation failure (extra/unknown fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "400":
          description: invoice_id missing or not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Payment clearing disabled (default)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentClearingStubError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings:
    post:
      operationId: createMarketplaceListing
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UuidResult"
        "422":
          description: Closed-schema validation failure (extra/unknown fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "400":
          description: Invalid listing payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: Listing conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}:
    get:
      operationId: getMarketplaceListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListing"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}/signature:
    post:
      operationId: attachListingSignature
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachSignatureRequest"
      responses:
        "200":
          description: Signature attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanResult"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "422":
          description: Closed-schema validation failure (extra/unknown fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "400":
          description: Invalid signature payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: Signature required/invalid or signing unconfigured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}/submit:
    post:
      operationId: submitListingForReview
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanResult"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "400":
          description: Invalid submit payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: State conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}/review:
    post:
      operationId: reviewMarketplaceListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewListingRequest"
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanResult"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "422":
          description: Closed-schema validation failure (extra/unknown fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "400":
          description: Invalid review payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: State conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}/publish:
    post:
      operationId: publishMarketplaceListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanResult"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "400":
          description: Invalid publish payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: Not approved or state conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}/revoke:
    post:
      operationId: revokeMarketplaceListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanResult"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "400":
          description: Invalid revoke payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: Already revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}/acquire:
    post:
      operationId: acquireMarketplaceListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "201":
          description: Technical acquisition created (not a purchase contract)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UuidResult"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "400":
          description: Invalid acquire payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "403":
          description: Capability or commercial policy required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: Already acquired / not published / signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}/host-acquire:
    post:
      operationId: hostAcquireMarketplaceListing
      summary: Technical acquire + allowlisted Extension Host projection
      description: >
        PHX-G172. Performs technical acquire (idempotent if already acquired),
        then projects first-party allowlisted package keys onto the sandboxed
        Extension Host. Does not execute Marketplace scripts, does not install
        packages, and is not a purchase settlement.
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "201":
          description: Host projection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostAcquireResult"
        "400":
          description: Invalid host-acquire payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "403":
          description: Not allowlisted or capability required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: State/signature conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}/pricing:
    post:
      operationId: setMarketplacePricing
      summary: Set fixed listing price (Foundation commercial policy)
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPricingRequest"
      responses:
        "200":
          description: Pricing stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanResult"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "422":
          description: Closed-schema validation failure (extra/unknown fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "400":
          description: Invalid pricing payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: Commercial policy required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}/invoices:
    post:
      operationId: createMarketplaceInvoice
      summary: Issue immediate invoice from current fixed pricing
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "201":
          description: Invoice issued (not a payment settlement)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UuidResult"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "400":
          description: Invalid invoice payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: Commercial policy required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}/disputes:
    post:
      operationId: openMarketplaceDispute
      summary: Open a publisher-tenant dispute record
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenDisputeRequest"
      responses:
        "201":
          description: Dispute opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UuidResult"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "422":
          description: Closed-schema validation failure (extra/unknown fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "400":
          description: Invalid dispute payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: State conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/disputes/{disputeId}/resolve:
    post:
      operationId: resolveMarketplaceDispute
      summary: Resolve dispute under publisher-tenant authority
      parameters:
        - name: disputeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDisputeRequest"
      responses:
        "200":
          description: Dispute resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanResult"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "422":
          description: Closed-schema validation failure (extra/unknown fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "400":
          description: Invalid resolve payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Dispute not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: State conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /marketplace/listings/{listingId}/revenue-share:
    post:
      operationId: setMarketplaceRevenueShare
      summary: Set platform share in basis points (0–5000)
      parameters:
        - $ref: "#/components/parameters/ListingId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRevenueShareRequest"
      responses:
        "200":
          description: Revenue share stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanResult"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "422":
          description: Closed-schema validation failure (extra/unknown fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "400":
          description: Invalid revenue-share payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: Commercial policy required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Marketplace service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    ListingId:
      name: listingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    FoundationStatusEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/FoundationStatusData"
    FoundationStatusData:
      type: object
      additionalProperties: false
      description: >
        Marketplace status including PHX-G400–G402 economy shells.
        ENABLE_*_NETWORK / external PSP remain default OFF; bank file import deferred.
      required:
        - writable
        - foundation_commercial_policy
        - economy_residual_reviewed
        - external_commercial_services
        - host_acquire_not_package_install
        - payment_clearing
        - payment_clearing_product
        - host_acquire_product
        - external_arbitration
        - metering
        - metering_product
        - entitlement_product
        - billing_record_product
        - dispute_arbitration_product
        - supported_surfaces
      properties:
        writable:
          type: boolean
        foundation_commercial_policy:
          type: string
          const: v1
        economy_residual_reviewed:
          type: boolean
          const: true
        external_commercial_services:
          type: string
          const: fail_closed
        host_acquire_not_package_install:
          type: boolean
          const: true
        payment_clearing:
          type: string
          enum: [fail_closed, internal_env_gated]
          description: fail_closed (default) or internal_env_gated when enabled
        payment_clearing_product:
          $ref: "#/components/schemas/PaymentClearingProduct"
        host_acquire_product:
          $ref: "#/components/schemas/HostAcquireProduct"
        external_arbitration:
          type: string
          const: fail_closed
        metering:
          type: string
          const: fail_closed
        metering_product:
          $ref: "#/components/schemas/MeteringProduct"
        entitlement_product:
          $ref: "#/components/schemas/EntitlementProduct"
        billing_record_product:
          $ref: "#/components/schemas/BillingRecordProduct"
        dispute_arbitration_product:
          $ref: "#/components/schemas/DisputeArbitrationProduct"
        supported_surfaces:
          type: array
          items:
            type: string
            minLength: 1
    MeteringProduct:
      type: object
      additionalProperties: false
      required:
        - surface
        - milestone
        - posture
        - entitlement_linked
        - external_psp
        - network_default
        - commercial_auto_write
        - routes
      properties:
        surface:
          type: string
          const: foundation_marketplace_metering_shell
        milestone:
          type: string
          const: PHX-G400
        posture:
          type: string
          const: shell_fail_closed
        entitlement_linked:
          type: boolean
          const: false
        external_psp:
