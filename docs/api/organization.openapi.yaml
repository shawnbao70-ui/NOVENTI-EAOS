openapi: 3.1.0
info:
  title: NOVENTI EAOS Organization API
  version: 1.0.9
  description: |
    PHX-G260 closes Organization entity schemas (additionalProperties false).
    PHX-G192 tightens status body field parity (organization).
    PHX-K07 Organization Kernel HTTP contract. tenant_id, subject_id,
    session_id and platform_scope are derived by the trusted authentication
    boundary and are never accepted from request bodies.
    PHX-G166 aligns KernelError to GatewayDetailError. PHX-G178 documents
    named Organization status codes (400/403/404/409/503).
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /organization/status:
    get:
      operationId: getOrganizationStatus
      summary: Read-only Foundation status posture
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Organization Foundation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationStatusEnvelope"
        default:
          $ref: "#/components/responses/KernelError"
  /platform/tenants:
    post:
      operationId: createTenant
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant and primary Enterprise created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UuidResult"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "422":
          description: Closed-schema validation failure (extra/unknown fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "400":
          description: Invalid tenant payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "403":
          description: Platform governor required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: Duplicate tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Organization service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /tenants/{tenantId}:
    get:
      operationId: getTenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Organization service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
  /platform/tenants/{tenantId}/suspension:
    post:
      operationId: suspendTenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedReasonRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          description: Tenant authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "422":
          description: Closed-schema validation failure (extra/unknown fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "400":
          description: Invalid suspension payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "403":
          description: Platform governor required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: Version/state conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Organization service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
    delete:
      operationId: reactivateTenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
