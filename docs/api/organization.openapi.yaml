                $ref: "#/components/schemas/HTTPValidationError"
        "400":
          description: Invalid reactivation payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "404":
          description: Membership not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "409":
          description: Version/state conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        "503":
          description: Organization service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDetailError"
        default:
          $ref: "#/components/responses/KernelError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnterpriseId:
      name: enterpriseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    FoundationStatusEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/FoundationStatusData"
    FoundationStatusData:
      type: object
      additionalProperties: false
      description: PHX-G192 Foundation status body field parity.
      required: [writable, supported_surfaces]
      properties:
        writable:
          type: boolean
          const: false
        supported_surfaces:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [legal_name]
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 255
        region_policy_ref:
          type: [string, "null"]
          maxLength: 255
    VersionedReasonRequest:
      type: object
      additionalProperties: false
      required: [reason, expected_version]
      properties:
        reason:
          type: string
          minLength: 1
        expected_version:
          type: integer
          minimum: 1
    CreateEnterpriseRequest:
      type: object
      additionalProperties: false
      required: [legal_name]
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 255
    UpsertUnitRequest:
      type: object
      additionalProperties: false
      required: [unit_type, name]
      properties:
        unit_id:
          type: [string, "null"]
          format: uuid
        enterprise_id:
          type: [string, "null"]
          format: uuid
        parent_unit_id:
          type: [string, "null"]
          format: uuid
        unit_type:
          enum: [hq, group, branch, department, other]
        name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          enum: [active, inactive]
          default: active
        expected_version:
          type: integer
          minimum: 1
      allOf:
        - if:
            required: [unit_id]
            properties:
              unit_id:
                type: string
                format: uuid
          then:
            required: [expected_version]
    SetUnitStatusRequest:
      type: object
      additionalProperties: false
      required: [status, reason, expected_version]
      properties:
        status:
          enum: [active, inactive, closed]
        reason:
          type: string
          minLength: 1
        expected_version:
          type: integer
          minimum: 1
    AddMembershipRequest:
      type: object
      additionalProperties: false
      required: [subject_id]
      properties:
        subject_id:
          type: string
          format: uuid
        enterprise_id:
          type: [string, "null"]
          format: uuid
        org_unit_id:
          type: [string, "null"]
          format: uuid
        membership_role_label:
          type: [string, "null"]
          maxLength: 128
    Tenant:
      type: object
      additionalProperties: false
      required: [id, legal_name, status, version]
      properties:
        id:
          type: string
          format: uuid
        legal_name:
          type: string
        status:
          enum: [active, suspended, closed]
        region_policy_ref:
          type: [string, "null"]
        version:
          type: integer
    EnterpriseList:
      type: array
      description: Bare JSON array of enterprises (runtime list[EnterpriseResponse]).
      items:
        $ref: "#/components/schemas/Enterprise"
    OrganizationUnitList:
      type: array
      description: Bare JSON array of organization units (runtime list[OrganizationUnitResponse]).
      items:
        $ref: "#/components/schemas/OrganizationUnit"
    MembershipList:
      type: array
      description: Bare JSON array of memberships (runtime list[MembershipResponse]).
      items:
        $ref: "#/components/schemas/Membership"
    Enterprise:
      type: object
      additionalProperties: false
      required: [id, tenant_id, legal_name, status, is_primary, version]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        legal_name:
          type: string
        status:
          enum: [active, suspended, closed]
        is_primary:
          type: boolean
        version:
          type: integer
    OrganizationUnit:
      type: object
      additionalProperties: false
      required: [id, tenant_id, enterprise_id, unit_type, name, status, version]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        enterprise_id:
          type: string
          format: uuid
        parent_unit_id:
          type: [string, "null"]
          format: uuid
        unit_type:
          enum: [hq, group, branch, department, other]
        name:
          type: string
        status:
          enum: [active, inactive, closed]
        version:
          type: integer
    MembershipStatus:
      enum: [active, suspended, ended]
    Membership:
      type: object
      additionalProperties: false
      required: [id, tenant_id, enterprise_id, subject_id, status, version]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        enterprise_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        org_unit_id:
          type: [string, "null"]
          format: uuid
        membership_role_label:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/MembershipStatus"
        ended_at:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
    UuidResult:
      type: object
      additionalProperties: false
      required: [id, data]
      description: >
        Unified UuidResult dialect (PHX-G170): `id` and `data` carry the same
        UUID for backward-compatible clients of either pre-unification shape.
      properties:
        id:
          type: string
          format: uuid
        data:
          type: string
          format: uuid
        audit_id:
          type: [string, "null"]
          format: uuid
    OkResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          const: true
        audit_id:
          type: [string, "null"]
          format: uuid
    ContextElevationDenialDetails:
      type: object
      additionalProperties: false
      description: >
        Known details shape for code TERMINAL_CONTEXT_ELEVATION_DENIED
        (live /context/echo elevation deny). PHX-G208/G220 per-code honesty;
        other error codes may use different details keys.
      required: [fields]
      properties:
        fields:
          type: array
          items:
            type: string
          description: Sorted denied elevation field names.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          description: >
            Optional structured denial context (G202/G204/G216/G220). Known
            elevation shape is composed via anyOf $ref to
            ContextElevationDenialDetails; residual object allows other keys.
          anyOf:
            - $ref: "#/components/schemas/ContextElevationDenialDetails"
            - type: object
              additionalProperties: true
        correlation_id:
          type: [string, "null"]
    ValidationErrorItem:
      type: object
      description: FastAPI/Pydantic request validation error item.
      required: [loc, msg, type]
      additionalProperties: true
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
    HTTPValidationError:
      type: object
      description: FastAPI request validation envelope (422 detail list).
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorItem"
    GatewayDetailError:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          $ref: "#/components/schemas/ErrorResponse"
  responses:
    Ok:
      description: Operation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OkResponse"
    KernelError:
      description: FastAPI HTTPException detail envelope (PHX-G166)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayDetailError"
