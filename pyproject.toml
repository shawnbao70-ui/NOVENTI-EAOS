[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noventi-eaos"
version = "0.2.5"
description = "NOVENTI Enterprise AI Operating System (EAOS) Phoenix Foundation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "NOVENTI" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "PyYAML>=6.0.3", "httpx>=0.27"]
persistence = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
]
api = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "cryptography>=42,<47",
]
kms-aws = ["boto3>=1.34"]
kms-gcp = ["google-cloud-kms>=2.24"]
kms-azure = ["azure-identity>=1.15", "azure-keyvault-keys>=4.9"]

[tool.setuptools.packages.find]
where = [".", "sdk"]
include = [
    "kernel*",
    "runtime*",
    "eaos_platform*",
    "smart_terminal*",
    "api*",
    "eaos_sdk*",
    "noventi*",
]
namespaces = false

[tool.setuptools.package-data]
smart_terminal = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sdk"]
addopts = "-q"
markers = [
    "postgresql: requires a dedicated destructive PostgreSQL test database",
    "contract_shard: contract suite shard metadata (see tests/contracts/shards.yaml)",
]
